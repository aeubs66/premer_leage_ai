name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Python, frontend, and workflow checks
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked Python dependencies
        run: uv sync --locked --python 3.12 --extra ml --extra neural --extra tracking --extra api --extra dev

      - name: Check Python formatting and lint
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests

      - name: Type check Python
        run: uv run --no-sync mypy src/football_ai

      - name: Run Python tests
        run: uv run --no-sync pytest -q

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint, type check, and test frontend
        run: |
          npm run --prefix frontend lint
          npm run --prefix frontend typecheck
          npm test --prefix frontend

      - name: Build frontend
        run: npm run --prefix frontend build
