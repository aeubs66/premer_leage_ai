<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Premier League AI — Football, with a probability.</title>
<desc id="desc">Editorial cover artwork for an independent football forecasting project. Copper pitch markings on charcoal, oversized ivory lettering, and a model-research theme. This is artwork, not an application screenshot.</desc>
