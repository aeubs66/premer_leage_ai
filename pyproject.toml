[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "premier-league-ai"
version = "0.1.0"
description = "Time-aware, reproducible Premier League forecasting and research"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.6,<2", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "pyyaml>=6,<7", "httpx>=0.28,<1", "sqlalchemy>=2,<3", "alembic>=1.14,<2", "typer>=0.15,<1", "joblib>=1.4,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
ml = ["xgboost>=3,<4", "optuna>=4,<5"]
neural = ["torch>=2.6,<3"]
tracking = ["mlflow>=3,<4"]
explain = ["shap>=0.47,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "pandas-stubs", "types-PyYAML", "scipy-stubs"]

[project.scripts]
football-ai = "football_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/football_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL", "slow: real model training"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/football_ai"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
